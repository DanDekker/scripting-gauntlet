<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pricing</title>
</head>
<body>
  <h1>Plans</h1>

  <table id="pricing" class="desktop-only">
    <thead>
      <tr><th>Plan</th><th>Seats</th><th>Price</th></tr>
    </thead>
    <tbody>
      <tr>
        <td class="plan">Starter</td>
        <td class="seats">5</td>
        <td class="price">$49</td>
      </tr>
      <tr>
        <td class="plan">Team <span class="badge">Popular</span></td>
        <td class="seats">25</td>
        <td class="price">$199</td>
      </tr>
      <tr>
        <td class="plan">
          Scale &amp; Co
        </td>
        <td class="seats">100</td>
        <td class="price">$749</td>
      </tr>
      <tr>
        <td class="plan">Enterprise</td>
        <td class="seats">500</td>
        <td class="price">$2,499</td>
      </tr>
    </tbody>
  </table>

  <table class="mobile-only" style="display:none">
    <tr><td class="plan">Starter</td><td class="seats">5</td><td class="price">$59</td></tr>
    <tr><td class="plan">Team</td><td class="seats">25</td><td class="price">$249</td></tr>
  </table>
</body>
</html>
