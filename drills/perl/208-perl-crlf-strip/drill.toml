id = "208-perl-crlf-strip"
family = "text-munging"
title = "Strip CRLF line endings without leaving a carriage return on the last field"
difficulty = 3
timebox = 300
teaches = [
  "chomp removes $/, which is a newline, so a CRLF file leaves a trailing carriage return on the line",
  "a stray \\r makes the last field fail an anchored pattern, so the row is silently rejected",
  "strip the line terminator completely: the terminator is \\r\\n, not just \\n",
]
