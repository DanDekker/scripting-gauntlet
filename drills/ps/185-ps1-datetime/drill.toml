id = "185-ps1-datetime"
family = "text-munging"
title = "Parse mixed date formats with explicit patterns, not culture guessing"
difficulty = 4
timebox = 300
teaches = [
  "[datetime]::Parse reads 03/04/2026 as March 4 under invariant culture and April 3 under en-GB",
