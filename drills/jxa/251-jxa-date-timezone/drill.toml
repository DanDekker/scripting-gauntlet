id = "251-jxa-date-timezone"
family = "text-munging"
title = "Parse explicit offsets and reject impossible dates in JXA"
difficulty = 4
timebox = 300
teaches = [
  "NSDateFormatter needs an en_US_POSIX locale for machine timestamps",
